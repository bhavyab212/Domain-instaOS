services:
  - type: web
    name: instaos-nonilion-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: LLM_API_KEY
        value: dummy_or_openrouter_key
      - key: LLM_MODEL
        value: dots-studio/dots-3-note-preview:free
      - key: PUBLIC_BASE_URL
        value: https://instaos-nonilion-engine.onrender.com
      - key: NONILION_CALLBACK_URL
        value: ""
      - key: SHIPPING_STAGE_DELAY_SEC
        value: "15"
      - key: STATIC_DIR
        value: generated_files
